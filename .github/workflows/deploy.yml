name: CI / Deploy

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# On main: use the 'pages' group so deploys never run in parallel.
# On other branches: group by ref so a new push cancels a redundant run.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'pages-deploy' || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: Lint / Type-check / Test / Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: relfinder/package-lock.json

      - name: Install dependencies
        working-directory: relfinder
        run: npm ci

      - name: Lint
        working-directory: relfinder
        run: npm run lint

      - name: Type-check
        working-directory: relfinder
        run: npm run type-check

      - name: Unit tests
        working-directory: relfinder
        run: npm run test:unit -- --run

      # Use build-only (not build) since type-check already ran above
      - name: Build
        working-directory: relfinder
        env:
          VITE_BASE_PATH: /relfinder/
        run: npm run build-only

      # GitHub Pages returns 404.html for unknown paths.
      # Copying index.html lets the Vue router boot and redirect correctly.
      - name: Copy index.html → 404.html
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: cp relfinder/dist/index.html relfinder/dist/404.html

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: relfinder/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
